name: Docker - Build and Push Release Image

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version to build, without the leading v.'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build, e.g. 2.13.0. Leave empty for the newest release.'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEWEST="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          VERSION="${REQUESTED:-$NEWEST}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a release version (X.Y.Z)"
            exit 1
          fi
          # latest must never move backwards when an older version is rebuilt by hand.
          IS_LATEST=false
          [ "$VERSION" = "${NEWEST#v}" ] && IS_LATEST=true
          {
            echo "version=$VERSION"
            echo "major=${VERSION%%.*}"
            echo "minor=$(echo "$VERSION" | cut -d. -f2)"
            echo "is_latest=$IS_LATEST"
          } >> "$GITHUB_OUTPUT"

      # The tag, not the branch: a dispatch runs from dev, whose HEAD is not the release.
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ steps.version.outputs.version }}

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
